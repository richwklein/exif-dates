version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 20
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 20
    labels:
      - 'dependencies'
